
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, responsive calculator built with HTML, CSS, Bootstrap and JavaScript.">

    <title>Modern Calculator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Calculator JavaScript -->
    <script src="index.js" defer></script>
</head>

<body class="bg-dark text-light">

    <!-- Main content -->
    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">

        <!-- Page heading -->
        <header class="text-center mb-4">
            <p class="text-info text-uppercase small fw-semibold mb-2">
                Simple. Fast. Functional.
            </p>
            <h1 class="display-5 fw-bold">Calculator</h1>
            <p class="text-secondary mb-0">
                Your everyday math companion
            </p>
        </header>

        <!-- Calculator -->
        <section id="calculator" class="card bg-black text-light border-secondary shadow-lg w-100"
            aria-label="Calculator" style="max-width: 360px;">

            <div class="card-body p-3 p-sm-4">

                <!-- Display -->
                <label for="display" class="form-label text-secondary small">
                    Display
                </label>
                <input
                    type="text"
                    id="display"
                    class="form-control form-control-lg bg-dark text-light text-end border-secondary mb-4"
                    aria-label="Calculator display"
                    aria-live="polite"
                    autocomplete="off"
                    readonly
                >

                <!-- Calculator buttons -->
                <div id="keys" class="row g-2">

                    <div class="col-3">
                        <button type="button" class="btn btn-outline-info w-100 py-3 operator-btn"
                            onclick="clearDisplay()" aria-label="Clear">C</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-info w-100 py-3 operator-btn"
                            onclick="appendToDisplay('/')">÷</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-info w-100 py-3 operator-btn"
                            onclick="appendToDisplay('*')">×</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-info w-100 py-3 operator-btn"
                            onclick="appendToDisplay('-')">−</button>
                    </div>

                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('7')">7</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('8')">8</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('9')">9</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-outline-info w-100 py-3 operator-btn"
                            onclick="appendToDisplay('+')">+</button>
                    </div>

                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('4')">4</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('5')">5</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('6')">6</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('1')">1</button>
                    </div>

                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('2')">2</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('3')">3</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('0')">0</button>
                    </div>
                    <div class="col-3">
                        <button type="button" class="btn btn-secondary w-100 py-3"
                            onclick="appendToDisplay('.')">.</button>
                    </div>

                    <!-- Calculate button -->
                    <div class="col-12">
                        <button type="button" class="btn btn-info text-dark fw-bold w-100 py-3"
                            onclick="calculate()">Calculate =</button>
                    </div>

                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-secondary small mt-4">
            <p class="mb-0">Built with HTML, CSS, Bootstrap &amp; JavaScript</p>
        </footer>

    </main>

</body>
</html>
